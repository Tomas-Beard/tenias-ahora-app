agent:
  name: jules
  role: Fullstack Executor & Code Writer
  
workspace:
  # Directorios donde Jules tiene permisos de lectura y escritura
  allowed_directories:
    - "./backend"
    - "./frontend"
    - "./.antigravity/skills"
  
  # Directorios de solo lectura (para evitar que borre la referencia original)
